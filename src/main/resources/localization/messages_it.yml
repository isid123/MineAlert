# !-----------------------------------------------------------------------------------------------!
#                              Benvenuto nel file di localizzazione.
# !-----------------------------------------------------------------------------------------------!
#
#
#   1) I CODICI COLORE sono supportati con il carattere '&'.
#      - Per l'uso, vedi http://minecraftwiki.net/wiki/Formatting_codes
#      - Quando li usi, racchiudi il messaggio tra virgolette in questo modo: "Ciao &cmondo."
#       - Per usare i colori HEX, usa la sintassi #123456: "Ciao #123456mondo."
#
#   2) PER NASCONDERE qualsiasi messaggio, impostalo su 'none'.
#
#   3) JSON è supportato. Fai precedere il messaggio da [JSON].
#
#   4) NOTA JAVASCRIPT: Alcuni dei nostri messaggi vengono compilati Just-In-Time con JavaScript.
#      Questi in genere contengono variabili come "self" al loro interno. SE NON SEI IN GRADO DI
#      PROGRAMMARE in JavaScript, fai molta attenzione e non rimuovere le parentesi () o le variabili!
#
# !-----------------------------------------------------------------------------------------------!

